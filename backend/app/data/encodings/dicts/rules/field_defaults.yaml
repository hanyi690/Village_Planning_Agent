# GDB 字段默认值规则 — 替代 gdb.py enrich_gdb_fields() 硬编码 if/elif 链
version: "2026_GUANGDONG_V1"

field_rules:
  # ── 标识字段 ──
  - field: "BSM"
    default: ""
    generator: "bsm_sequence"

  # ── 要素代码 ──
  - field: "YSDM"
    default: "2001010100"
    lookup: "ysdm_defaults"

  # ── 行政区划 ──
  - field: "DJZQMC"
    from_param: "xzqhmc"

  - field: "DJZQDM"
    from_param: "xzqhdm"

  - field: "XZQHDM"
    from_param: "xzqhdm"

  - field: "XZQHMC"
    from_param: "xzqhmc"

  - field: "XZQHM"
    from_param: "xzqhmc"

  # ── 规划用途名称 ──
  - field: "GHYTMC"
    lookup: "ghytbm_to_ghytmc"
    depends_on: "GHYTBM"

  - field: "GHYTBM"
    default: ""

  - field: "GHFLBM"
    default: ""

  - field: "QMGHFLBM"
    copy_from: "GHFLBM"

  - field: "QMDLBM"
    copy_from: "DLBM"

  # ── 地类名称 ──
  - field: "DLMC"
    lookup: "dlbm_to_dlmc"
    depends_on: "DLBM"

  - field: "SDDLBM"
    copy_from: "DLBM"

  - field: "SDDLMC"
    copy_from: "DLMC"

  # ── 面积字段 ──
  - field: "MJ"
    default: 0.0
    computed: true

  - field: "DLMJ"
    default: 0.0
    computed: true

  - field: "JBNT_MJ"
    default: 0.0
    computed: true

  # ── 描述字段 ──
  - field: "MS"
    default: ""

  - field: "TBH"
    default: ""

  - field: "BH"
    default: ""

  - field: "LYYSDM"
    default: ""

  - field: "LX"
    default: "有条件建设区"

  # ── 土地用途分区字段 (TDYT) ──
  - field: "TDYTFQDM"
    lookup: "ghflbm_to_tdytfqdm"
    depends_on: "GHFLBM"

  - field: "TDYTFQBH"
    default: ""

  - field: "YTFQMC"
    lookup: "ghflbm_to_tdyt_name"
    depends_on: "GHFLBM"

  # ── 建设用地管制区字段 (JSYDGZQ) ──
  - field: "TDKJGZFQDM"
    lookup: "planning_zone_to_control_code"
    depends_on: "PLANNING_ZONE"

  - field: "TDKJGZFQBH"
    default: ""

  - field: "GZFQMC"
    lookup: "space_control_name"
    depends_on: "TDKJGZFQDM"

  - field: "GHNF"
    default: ""

  # ── 落实约束性指标字段 (QMDLTB) ──
  - field: "LSYSXZB1"
    default: ""

  - field: "LSZBMJ1"
    default: 0.0

  - field: "LSYSXZB2"
    default: ""

  - field: "LSZBMJ2"
    default: 0.0

  - field: "LSYSXZB3"
    default: ""

  - field: "LSZBMJ3"
    default: 0.0

  # ── 通用空字符串字段 ──
  - field: "BZ"
    default: ""

  - field: "分类"
    default: ""

  - field: "注记"
    default: ""
