# 村土地利用规划用地分类（3-tier）
#
# 来源: 《村土地利用规划编制技术导则》附表 4
#   "村规划采取农业用地、村庄建设用地、生态用地的分类方式。
#    以《土地利用现状分类》（以下简称《现状分类》）、
#    《乡（镇）土地利用总体规划用途分类》（以下简称《乡规分类》）为基础，
#    参考《城市用地分类与规划建设用地标准》、《镇用地分类》、
#    《村庄规划用地分类》等标准，研究形成村规划用途分类体系。"
#
# 用途: 村域 3-tier 宏观分类（最粗粒度），与附录5 5-tier、GB 50137 9 大类并列。
version: "2026_GUANGDONG_V1"
standard: "《村土地利用规划编制技术导则》附表 4"
system: "zone_types_village"

classes:
  - code: "农业用地"
    name: "农业用地"
    description: "耕地、园地、林地、草地等农业生产用地"

  - code: "村庄建设用地"
    name: "村庄建设用地"
    description: "村庄住宅、公共服务设施、生产仓储、基础设施等建设用地"

  - code: "生态用地"
    name: "生态用地"
    description: "水域、自然保留地、生态林等具有生态保护功能的用地"