version: "1.0"

# GIS Data Sources Configuration
# See: docs/gis/proposals/04_MULTI_SOURCE_DATA_ARCHITECTURE.md

sources:
  # ============================================================
  # Vector — Local Files (Jintian Village)
  # ============================================================

  jintian_current_landuse:
    driver: file_vector
    path: "data/gis/jintian/current/landuse.geojson"
    format: geojson
    crs: EPSG:4326
    layer_type: landuse_current
    encoding: utf-8

  jintian_boundary:
    driver: file_vector
    path: "data/gis/jintian/current/boundary.geojson"
    format: geojson
    crs: EPSG:4326
    layer_type: boundary
    encoding: utf-8

  jintian_road:
    driver: file_vector
    path: "data/gis/jintian/current/road.geojson"
    format: geojson
    crs: EPSG:4326
    layer_type: road
    encoding: utf-8

  jintian_admin_boundary_line:
    driver: file_vector
    path: "data/gis/jintian/current/admin_boundary_line.geojson"
    format: geojson
    crs: EPSG:4326
    layer_type: admin_boundary_line
    encoding: utf-8

  jintian_annotation:
    driver: file_vector
    path: "data/gis/jintian/current/annotation.geojson"
    format: geojson
    crs: EPSG:4326
    layer_type: annotation
    encoding: utf-8

  jintian_planned_landuse:
    driver: file_vector
    path: "data/gis/jintian/planned/landuse.geojson"
    format: geojson
    crs: EPSG:4326
    layer_type: landuse_planned
    encoding: utf-8

  jintian_planned_road:
    driver: file_vector
    path: "data/gis/jintian/planned/road.geojson"
    format: geojson
    crs: EPSG:4326
    layer_type: road_planned
    encoding: utf-8

  jintian_planned_annotation:
    driver: file_vector
    path: "data/gis/jintian/planned/annotation.geojson"
    format: geojson
    crs: EPSG:4326
    layer_type: annotation_planned
    encoding: utf-8

  jintian_farmland_protection:
    driver: file_vector
    path: "data/gis/jintian/planned/farmland_protection.geojson"
    format: geojson
    crs: EPSG:4326
    layer_type: farmland_protection
    encoding: utf-8

  jintian_ecological_protection:
    driver: file_vector
    path: "data/gis/jintian/planned/ecological_protection.geojson"
    format: geojson
    crs: EPSG:4326
    layer_type: ecological_protection
    encoding: utf-8

  jintian_historical_protection:
    driver: file_vector
    path: "data/gis/jintian/planned/historical_protection.geojson"
    format: geojson
    crs: EPSG:4326
    layer_type: historical_protection
    encoding: utf-8

  jintian_construction_zone:
    driver: file_vector
    path: "data/gis/jintian/planned/construction_zone.geojson"
    format: geojson
    crs: EPSG:4326
    layer_type: construction_zone
    encoding: utf-8

  jintian_geological_hazard:
    driver: file_vector
    path: "data/gis/jintian/planned/geological_hazard_points.geojson"
    format: geojson
    crs: EPSG:4326
    layer_type: geological_hazard_points
    encoding: utf-8

  # ============================================================
  # Vector — Guangdong Tianditu Thematic Services
  # ============================================================

  gd_three_zones:
    driver: tianditu_vector
    service_id: SQSXWPSJ
    protocol: mapserver_rest
    crs: EPSG:4490
    layers:
      - id: 0
        name: "永久基本农田保护"
        layer_type: farmland_protection
      - id: 1
        name: "城镇开发边界"
        layer_type: urban_dev_boundary
      - id: 2
        name: "生态保护红线"
        layer_type: ecological_protection

  gd_ecological:
    driver: tianditu_vector
    service_id: GDSTBHHX
    protocol: mapserver_rest
    crs: EPSG:4490
    layers:
      - id: 0
        name: "生态保护红线"
        layer_type: ecological_protection

  gd_hazard:
    driver: tianditu_vector
    service_id: DZZHD
    protocol: mapserver_rest
    crs: EPSG:4490
    layers:
      - id: 0
        name: "地质灾害隐患点"
        layer_type: geological_hazard_points

  # ============================================================
  # Raster Tiles — Tianditu WMTS
  # ============================================================

  tianditu_img_base:
    driver: tianditu_tile
    layer: img_c
    projection: c
    zoom_range: [1, 18]
    format: png
    crs: EPSG:4326
    layer_type: dom
    cache_dir: "data/cache/tiles/img_c"

  tianditu_terrain:
    driver: tianditu_tile
    layer: ter_c
    projection: c
    zoom_range: [1, 18]
    format: png
    crs: EPSG:4326
    layer_type: terrain_visual
    cache_dir: "data/cache/tiles/ter_c"

  tianditu_annotation:
    driver: tianditu_tile
    layer: cia_c
    projection: c
    zoom_range: [1, 18]
    format: png
    crs: EPSG:4326
    layer_type: annotation
    cache_dir: "data/cache/tiles/cia_c"

  # ============================================================
  # Raster Files — DEM / DOM
  # ============================================================

  dem_local:
    driver: local_raster
    path: "data/gis/jintian/terrain/dem.tif"
    format: GeoTIFF
    crs: EPSG:4326
    layer_type: dem

  dom_local:
    driver: local_raster
    path: "data/gis/jintian/terrain/dom.tif"
    format: GeoTIFF
    crs: EPSG:4326
    layer_type: dom

  dem_alos:
    driver: remote_raster
    provider: alos_aw3d30
    resolution: "12.5m"
    format: GeoTIFF
    crs: EPSG:4326
    layer_type: dem
    download_guide:
      url: "https://www.eorc.jaxa.jp/ALOS/en/aw3d30/"
      steps:
        - "注册JAXA账号"
        - "选择研究区域"
        - "下载GeoTIFF格式DEM"
    local_path: "data/gis/jintian/terrain/dem_alos.tif"

  dem_gdem:
    driver: remote_raster
    provider: gdem_v3
    resolution: "30m"
    format: GeoTIFF
    crs: EPSG:4326
    layer_type: dem
    download_guide:
      url: "https://www.gscloud.cn/"
      steps:
        - "注册地理空间数据云账号"
        - "选择数据集 GDEMV3 30M"
        - "按行政区选择村庄所在区域"
        - "下载GeoTIFF格式DEM"
    local_path: "data/gis/jintian/terrain/dem_gdem.tif"
