# GDB 图层定义 — 12 layers (5 current + 7 planned)
version: "2026_GUANGDONG_V1"
standard: "广东省村庄规划数据库技术规范"

naming:
  feature_type_codes:
    polygon: "PBL"
    line: "LJJ"
    point: "DMM"
  default_prefix: "JT"
  default_date: "20221212"

layers:
  # ── 现状要素层 (5 layers) ──
  - key: "admin_area"
    gdb_name_template: "{prefix}_行政区划_PBL_{date}"
    geometry: "MultiPolygon"
    fields:
      - [BSM, "int32"]
      - [YSDM, "str:10"]
      - [DJZQMC, "str:100"]
      - [DJZQDM, "str:12"]
      - [MJ, "float64"]
      - [BZ, "str:200"]
    source: "current/boundary.geojson"
    internal_layer: "boundary"
    category: "current"
    description: "行政村行政区划面"
    ysdm_default: "1000600800"

  - key: "admin_boundary_line"
    gdb_name_template: "{prefix}_行政区划界线_LJJ_{date}"
    geometry: "MultiLineString"
    fields:
      - [BSM, "int16"]
      - [YSDM, "str:10"]
      - [DJZQDM, "str:12"]
      - ["界线类型", "int32"]
      - ["界线说明", "str:20"]
    source: "current/admin_boundary_line.geojson"
    internal_layer: "boundary"
    category: "current"
    description: "行政区划界线"
    ysdm_default: "1000600800"

  - key: "current_landuse"
    gdb_name_template: "{prefix}_现状地类图斑_LJJ_{date}"
    geometry: "MultiPolygon"
    fields:
      - [BSM, "str:18"]
      - [YSDM, "str:10"]
      - [DLBM, "str:4"]
      - [DLMC, "str:20"]
      - [SDDLBM, "str:5"]
      - [SDDLMC, "str:60"]
      - [DLMJ, "float64"]
    source: "current/landuse.geojson"
    internal_layer: "function_zone"
    category: "current"
    description: "基期年现状地类图斑"
    ysdm_default: "2001010100"

  - key: "current_road"
    gdb_name_template: "{prefix}_农村居民点外道路_LJJ_{date}"
    geometry: "MultiLineString"
    fields:
      - [Shape_Length, "float64"]
    source: "current/road.geojson"
    internal_layer: "infrastructure"
    category: "current"
    description: "现状道路"

  - key: "current_annotation"
    gdb_name_template: "{prefix}_现状注记_LJJ_{date}"
    geometry: "Point"
    fields:
      - ["注记", "str:100"]
      - ["分类", "str:20"]
    source: "current/annotation.geojson"
    internal_layer: "annotation"
    category: "current"
    description: "现状注记"

  # ── 规划要素层 (7 layers) ──
  - key: "planned_landuse"
    gdb_name_template: "{prefix}_期末地类_LJJ_{date}"
    geometry: "MultiPolygon"
    fields:
      - [BSM, "int32"]
      - [YSDM, "str:10"]
      - [TBH, "str:8"]
      - [XZQHDM, "str:12"]
      - [XZQHMC, "str:100"]
      - [DLBM, "str:4"]
      - [DLMJ, "float64"]
      - [QMDLBM, "str:4"]
      - [LYYSDM, "str:10"]
      - [MS, "str:90"]
      - [GHFLBM, "str:4"]
      - [QMGHFLBM, "str:4"]
      - [GHYTBM, "str:4"]
      - [GHYTMC, "str:20"]
      - [LSYSXZB1, "str:4"]
      - [LSZBMJ1, "float64"]
      - [LSYSXZB2, "str:4"]
      - [LSZBMJ2, "float64"]
      - [LSYSXZB3, "str:4"]
      - [LSZBMJ3, "float64"]
      - [Shape_Length, "float64"]
      - [Shape_Area, "float64"]
    source: "planned/landuse.geojson"
    internal_layer: "function_zone"
    category: "planned"
    description: "目标年期末地类图斑 QMDLTB (广东省村庄规划数据库标准)"
    ysdm_default: "2003070100"

  - key: "ecological_redline"
    gdb_name_template: "{prefix}_生态保护红线_LJJ_{date}"
    geometry: "MultiPolygon"
    fields:
      - [OBJECTID, "int32"]
      - ["区县", "str:20"]
      - ["分带", "float64"]
      - ["地市", "str:20"]
      - [MJ, "float64"]
    source: "planned/ecological_protection.geojson"
    internal_layer: "ecological_redline"
    category: "planned"
    description: "生态保护红线"
    ysdm_default: "2003020100"

  - key: "farmland_protection"
    gdb_name_template: "{prefix}_永久基本农田保护红线_LJJ_{date}"
    geometry: "MultiPolygon"
    fields:
      - [YSDM, "str:10"]
      - [XZQHDM, "str:12"]
      - [XZQHMC, "str:50"]
      - [BSM, "str:18"]
      - [JBNT_MJ, "float64"]
    source: "planned/farmland_protection.geojson"
    internal_layer: "farmland_protection"
    category: "planned"
    description: "永久基本农田保护红线"
    ysdm_default: "2003020100"

  - key: "historical_protection"
    gdb_name_template: "{prefix}_历史文化保护线_LJJ_{date}"
    geometry: "MultiPolygon"
    fields:
      - [BUFF_DIST, "float64"]
      - [ORIG_FID, "float64"]
    source: "planned/historical_protection.geojson"
    internal_layer: "historical_protection"
    category: "planned"
    description: "历史文化保护线"
    ysdm_default: "2003020100"

  - key: "construction_zone"
    gdb_name_template: "{prefix}_有条件建设区_LJJ_{date}"
    geometry: "MultiPolygon"
    fields:
      - [BSM, "str:18"]
      - [YSDM, "str:10"]
      - [BH, "str:20"]
      - [XZQHDM, "str:12"]
      - [XZQHM, "str:50"]
      - [LX, "str:20"]
      - [MJ, "float64"]
    source: "planned/construction_zone.geojson"
    internal_layer: "construction_zone"
    category: "planned"
    description: "有条件建设区"
    ysdm_default: "2001010100"

  - key: "space_control_zone"
    gdb_name_template: "{prefix}_建设用地管制区_LJJ_{date}"
    geometry: "MultiPolygon"
    fields:
      - [BSM, "int32"]
      - [YSDM, "str:10"]
      - [XZQHDM, "str:12"]
      - [XZQHMC, "str:100"]
      - [TDKJGZFQDM, "str:4"]
      - [TDKJGZFQBH, "str:2"]
      - [GHNF, "str:4"]
      - [MJ, "float64"]
      - [GZFQMC, "str:50"]
    source: "planned/space_control_zone.geojson"
    internal_layer: "space_control_zone"
    category: "planned"
    description: "建设用地管制区 (JSYDGZQ, 允许510/限制520/有条件530/禁止540)"

  - key: "land_use_zone"
    gdb_name_template: "{prefix}_土地用途分区_LJJ_{date}"
    geometry: "MultiPolygon"
    fields:
      - [BSM, "int32"]
      - [YSDM, "str:10"]
      - [XZQHDM, "str:12"]
      - [XZQHMC, "str:100"]
      - [TDYTFQDM, "str:4"]
      - [TDYTFQBH, "str:4"]
      - [MJ, "float64"]
      - [MS, "str:90"]
      - [YTFQMC, "str:30"]
    source: "planned/land_use_zone.geojson"
    internal_layer: "land_use_zone"
    category: "planned"
    description: "土地用途分区 (TDYT, 广东省县级土地利用总体规划数据库标准)"

  - key: "hazard_points"
    gdb_name_template: "{prefix}_地质灾害点_LJJ_{date}"
    geometry: "Point"
    fields:
      - ["地质灾害点名称", "str:100"]
      - ["纬度", "str:30"]
      - ["经度", "str:30"]
      - ["类型", "str:20"]
      - ["大小", "str:20"]
    source: "planned/geological_hazard_points.geojson"
    internal_layer: "facility_point"
    category: "planned"
    description: "地质灾害点"

  - key: "planned_annotation"
    gdb_name_template: "{prefix}_注记_LJJ_{date}"
    geometry: "Point"
    fields:
      - ["注记", "str:100"]
      - ["分类", "str:20"]
    source: "planned/annotation.geojson"
    internal_layer: "annotation"
    category: "planned"
    description: "规划注记"

  - key: "planned_road"
    gdb_name_template: "{prefix}_农村居民点外道路_LJJ_{date}"
    geometry: "MultiLineString"
    fields:
      - [LnType, "float64"]
      - [LeftLn_FID, "float64"]
      - [RightLn_FID, "float64"]
      - [F1, "float64"]
      - [Shape_Length, "float64"]
    source: "planned/road.geojson"
    internal_layer: "infrastructure"
    category: "planned"
    description: "规划道路"

# 内部图层类型 → GDB 图层映射
internal_layer_to_gdb_keys:
  boundary: ["admin_area", "admin_boundary_line"]
  function_zone: ["current_landuse", "planned_landuse"]
  infrastructure: ["current_road", "planned_road"]
  ecological_redline: ["ecological_redline"]
  farmland_protection: ["farmland_protection"]
  historical_protection: ["historical_protection"]
  construction_zone: ["construction_zone"]
  space_control_zone: ["space_control_zone"]
  land_use_zone: ["land_use_zone"]
  facility_point: ["hazard_points"]
  annotation: ["current_annotation", "planned_annotation"]
  planning_zone: []
  sensitivity_zone: []
  development_axis: []
  settlement_zone: []
  isochrone: []
