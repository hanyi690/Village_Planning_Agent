# GB/T 21010-2017 土地利用现状分类 — 单一真相源
# 此文件仅包含国家标准的编码和含义原文，不包含规划分区属性。
# 规划分区属性 (zone_type/planning_zone/primary_zone) 见其他体系文件。
#
# 与土规编码 (tugui.yaml) 的区别：
#   国标 0101=水田, 土规 0110=水田
#   国标 0702=农村宅基地, 土规 2030=农村居民点
# 两者是独立编码体系，不存在官方映射表。
version: "2026_GUANGDONG_V1"
standard: "GB/T 21010-2017"
system: "gbt21010"
code_format: "4-digit, 12 一级类 + 73 二级类"
usage: |
  本标准适用于土地调查、规划、审批、供应、整治、执法、
  评价、统计、登记及信息化管理等工作。
  三调成果的现状地类编码 (DLBM) 使用此编码体系。

classes:
  # === 01 耕地 ===
  - code: "0101"
    name: "水田"
    gb_ref: "0101"
    description: "指用于种植水稻、莲藕等水生农作物的耕地。包括实行水生、旱生农作物轮种的耕地"

  - code: "0102"
    name: "水浇地"
    gb_ref: "0102"
    description: "指有水源保证和灌溉设施，在一般年景能正常灌溉，种植旱生农作物（含蔬菜）的耕地"

  - code: "0103"
    name: "旱地"
    gb_ref: "0103"
    description: "指无灌溉设施，主要靠天然降水种植旱生农作物的耕地"

  # === 02 园地 ===
  - code: "0201"
    name: "果园"
    gb_ref: "0201"
    description: "指种植果树的园地"

  - code: "0202"
    name: "茶园"
    gb_ref: "0202"
    description: "指种植茶树的园地"

  - code: "0203"
    name: "橡胶园"
    gb_ref: "0203"
    description: "指种植橡胶树的园地"

  - code: "0204"
    name: "其他园地"
    gb_ref: "0204"
    description: "指种植桑树、可可、咖啡、油棕、胡椒、药材等其他多年生作物的园地"

  # === 03 林地 ===
  - code: "0301"
    name: "乔木林地"
    gb_ref: "0301"
    description: "指乔木郁闭度≥0.2的林地，不包括森林沼泽"

  - code: "0302"
    name: "竹林地"
    gb_ref: "0302"
    description: "指生长竹类植物，郁闭度≥0.2的林地"

  - code: "0303"
    name: "红树林地"
    gb_ref: "0303"
    description: "指沿海生长红树植物的林地"

  - code: "0304"
    name: "森林沼泽"
    gb_ref: "0304"
    description: "以乔木森林植物为优势群落的淡水沼泽"

  - code: "0305"
    name: "灌木林地"
    gb_ref: "0305"
    description: "指灌木覆盖度≥40%的林地，不包括灌丛沼泽"

  - code: "0306"
    name: "灌丛沼泽"
    gb_ref: "0306"
    description: "以灌丛植物为优势群落的淡水沼泽"

  - code: "0307"
    name: "其他林地"
    gb_ref: "0307"
    description: "包括疏林地（树木郁闭度≥0.1、＜0.2的林地）、未成林地、迹地、苗圃等林地"

  # === 04 草地 ===
  - code: "0401"
    name: "天然牧草地"
    gb_ref: "0401"
    description: "指以天然草本植物为主，用于放牧或割草的草地"

  - code: "0402"
    name: "沼泽草地"
    gb_ref: "0402"
    description: "指以天然草本植物为主的沼泽化的低地草甸、高寒草甸"

  - code: "0403"
    name: "人工牧草地"
    gb_ref: "0403"
    description: "指人工种植牧草的草地"

  - code: "0404"
    name: "其他草地"
    gb_ref: "0404"
    description: "指树木郁闭度＜0.1，表层为土质，不用于放牧的草地"

  # === 05 商服用地 ===
  - code: "0501"
    name: "零售商业用地"
    gb_ref: "0501"
    description: "以零售功能为主的商铺、商场、超市、市场和加油、加气、充换电站等的用地"

  - code: "0502"
    name: "批发市场用地"
    gb_ref: "0502"
    description: "以批发功能为主的市场用地"

  - code: "0503"
    name: "餐饮用地"
    gb_ref: "0503"
    description: "饭店、餐厅、酒吧等用地"

  - code: "0504"
    name: "旅馆用地"
    gb_ref: "0504"
    description: "宾馆、旅馆、招待所、服务型公寓、度假村等用地"

  - code: "0505"
    name: "商务金融用地"
    gb_ref: "0505"
    description: "指商务服务用地，以及经营性的办公场所用地"

  - code: "0506"
    name: "娱乐用地"
    gb_ref: "0506"
    description: "指剧院、音乐厅、电影院、歌舞厅、网吧、影视城、仿古城以及绿地率小于65%的大型游乐等设施用地"

  - code: "0507"
    name: "其他商服用地"
    gb_ref: "0507"
    description: "指零售商业、批发市场、餐饮、旅馆、商务金融、娱乐用地以外的其他商业、服务业用地"

  # === 06 工矿仓储用地 ===
  - code: "0601"
    name: "工业用地"
    gb_ref: "0601"
    description: "指工业生产、产品加工制造、机械和设备修理及直接为工业生产等服务的附属设施用地"

  - code: "0602"
    name: "采矿用地"
    gb_ref: "0602"
    description: "指采矿、采石、采砂（沙）场，砖瓦窑等地面生产用地，排土（石）及尾矿堆放地"

  - code: "0603"
    name: "盐田"
    gb_ref: "0603"
    description: "指用于生产盐的土地，包括晒盐场所、盐池及附属设施用地"

  - code: "0604"
    name: "仓储用地"
    gb_ref: "0604"
    description: "指用于物资储备、中转的场所用地，包括物流仓储设施、配送中心、转运中心等"

  # === 07 住宅用地 ===
  - code: "0701"
    name: "城镇住宅用地"
    gb_ref: "0701"
    description: "指城镇用于生活居住的各类房屋用地及其附属设施用地"

  - code: "0702"
    name: "农村宅基地"
    gb_ref: "0702"
    description: "指农村用于生活居住的宅基地"

  # === 08 公共管理与公共服务用地 ===
  - code: "0801"
    name: "机关团体用地"
    gb_ref: "0801"
    description: "指用于党政机关、社会团体、群众自治组织等的用地"

  - code: "0802"
    name: "新闻出版用地"
    gb_ref: "0802"
    description: "指用于广播电台、电视台、电影厂、报社、杂志社、通讯社、出版社等的用地"

  - code: "0803"
    name: "教育用地"
    gb_ref: "0803"
    description: "指用于各类教育用地"

  - code: "0804"
    name: "科研用地"
    gb_ref: "0804"
    description: "指独立的科研、勘察、研发、设计、检验检测等科研事业单位及其附属设施用地"

  - code: "0805"
    name: "医疗卫生用地"
    gb_ref: "0805"
    description: "指医疗、保健、卫生、防疫、康复和急救设施等用地"

  - code: "0806"
    name: "社会福利用地"
    gb_ref: "0806"
    description: "指为社会提供福利和慈善服务的设施及其附属设施用地"

  - code: "0807"
    name: "文化设施用地"
    gb_ref: "0807"
    description: "指图书、展览等公共文化活动设施用地"

  - code: "0808"
    name: "体育用地"
    gb_ref: "0808"
    description: "指体育场馆和体育训练基地等用地"

  - code: "0809"
    name: "公用设施用地"
    gb_ref: "0809"
    description: "指用于城乡基础设施的用地"

  - code: "0810"
    name: "公园与绿地"
    gb_ref: "0810"
    description: "指城镇、村庄范围内的公园、动物园、植物园、街心花园、广场和用于休憩、美化环境及防护的绿化用地"

  # === 09 特殊用地 ===
  - code: "0901"
    name: "军事设施用地"
    gb_ref: "0901"
    description: "指直接用于军事目的的设施用地"

  - code: "0902"
    name: "使领馆用地"
    gb_ref: "0902"
    description: "指用于外国政府及国际组织驻华使领馆、办事处等的用地"

  - code: "0903"
    name: "监教场所用地"
    gb_ref: "0903"
    description: "指用于监狱、看守所、劳改场、戒毒所等的建筑用地"

  - code: "0904"
    name: "宗教用地"
    gb_ref: "0904"
    description: "指专门用于宗教活动的庙宇、寺院、道观、教堂等宗教自用地"

  - code: "0905"
    name: "殡葬用地"
    gb_ref: "0905"
    description: "指陵园、墓地、殡葬场所用地"

  - code: "0906"
    name: "风景名胜设施用地"
    gb_ref: "0906"
    description: "指风景名胜景点（包括名胜古迹、旅游景点、革命遗址、自然保护区、森林公园、地质公园、湿地公园等）的管理机构，以及旅游服务设施的建筑用地"

  # === 10 交通运输用地 ===
  - code: "1001"
    name: "铁路用地"
    gb_ref: "1001"
    description: "指用于铁道线路及场站的用地"

  - code: "1002"
    name: "轨道交通用地"
    gb_ref: "1002"
    description: "指用于轻轨、现代有轨电车、单轨等轨道交通用地，以及场站的用地"

  - code: "1003"
    name: "公路用地"
    gb_ref: "1003"
    description: "指用于国道、省道、县道和乡道的用地"

  - code: "1004"
    name: "城镇村道路用地"
    gb_ref: "1004"
    description: "指城镇、村庄范围内公用道路及行道树用地"

  - code: "1005"
    name: "交通服务场站用地"
    gb_ref: "1005"
    description: "指城镇、村庄范围内交通服务设施用地"

  - code: "1006"
    name: "农村道路"
    gb_ref: "1006"
    description: "在农村范围内，南方宽度≥1.0m、≤8m，北方宽度≥2.0m、≤8m，用于村间、田间交通运输"

  - code: "1007"
    name: "机场用地"
    gb_ref: "1007"
    description: "指用于民用机场、军民合用机场的用地"

  - code: "1008"
    name: "港口码头用地"
    gb_ref: "1008"
    description: "指用于人工修建的客运、货运、捕捞及工程、工作船舶停靠的场所及其附属建筑物的用地"

  - code: "1009"
    name: "管道运输用地"
    gb_ref: "1009"
    description: "指用于运输煤炭、矿石、石油、天然气等管道及其相应附属设施的地上部分用地"

  # === 11 水域及水利设施用地 ===
  - code: "1101"
    name: "河流水面"
    gb_ref: "1101"
    description: "指天然形成或人工开挖河流常水位岸线之间的水面"

  - code: "1102"
    name: "湖泊水面"
    gb_ref: "1102"
    description: "指天然形成的积水区常水位岸线所围成的水面"

  - code: "1103"
    name: "水库水面"
    gb_ref: "1103"
    description: "指人工拦截汇集而成的总设计库容≥10万m³的水库正常蓄水位岸线所围成的水面"

  - code: "1104"
    name: "坑塘水面"
    gb_ref: "1104"
    description: "指人工开挖或天然形成的蓄水量＜10万m³的坑塘常水位岸线所围成的水面"

  - code: "1105"
    name: "沿海滩涂"
    gb_ref: "1105"
    description: "指沿海大潮高潮位与低潮位之间的潮浸地带"

  - code: "1106"
    name: "内陆滩涂"
    gb_ref: "1106"
    description: "指河流、湖泊常水位至洪水位间的滩地"

  - code: "1107"
    name: "沟渠"
    gb_ref: "1107"
    description: "指人工修建，南方宽度≥1.0m、北方宽度≥2.0m用于引、排、灌的渠道"

  - code: "1108"
    name: "沼泽地"
    gb_ref: "1108"
    description: "指经常积水或渍水，一般生长湿生植物的土地"

  - code: "1109"
    name: "水工建筑用地"
    gb_ref: "1109"
    description: "指人工修建的闸、坝、堤路林、水电厂房、扬水站等常水位岸线以上的建（构）筑物用地"

  - code: "1110"
    name: "冰川及永久积雪"
    gb_ref: "1110"
    description: "指表层被冰雪常年覆盖的土地"

  # === 12 其他土地 ===
  - code: "1201"
    name: "空闲地"
    gb_ref: "1201"
    description: "指城镇、村庄、工矿范围内尚未使用的土地"

  - code: "1202"
    name: "设施农用地"
    gb_ref: "1202"
    description: "指直接用于经营性畜禽养殖生产设施及附属设施用地"

  - code: "1203"
    name: "田坎"
    gb_ref: "1203"
    description: "指梯田及梯状坡地耕地中，主要用于拦蓄水和护坡的地坎"

  - code: "1204"
    name: "盐碱地"
    gb_ref: "1204"
    description: "指表层盐碱聚集，生长天然耐盐植物的土地"

  - code: "1205"
    name: "沙地"
    gb_ref: "1205"
    description: "指表层为沙覆盖、基本无植被的土地"

  - code: "1206"
    name: "裸土地"
    gb_ref: "1206"
    description: "指表层为土质，基本无植被覆盖的土地"

  - code: "1207"
    name: "裸岩石砾地"
    gb_ref: "1207"
    description: "指表层为岩石或石砾，其覆盖面积≥70%的土地"

  # === 大类汇总码 (非标准编码，项目内部使用) ===
  - code: "0100"
    name: "耕地"
    gb_ref: "01"
    description: "GB/T 21010 一级类 01 耕地 汇总码 (项目内部使用)"

  - code: "0200"
    name: "园地"
    gb_ref: "02"
    description: "GB/T 21010 一级类 02 园地 汇总码 (项目内部使用)"

  - code: "0300"
    name: "林地"
    gb_ref: "03"
    description: "GB/T 21010 一级类 03 林地 汇总码 (项目内部使用)"

  - code: "0400"
    name: "草地"
    gb_ref: "04"
    description: "GB/T 21010 一级类 04 草地 汇总码 (项目内部使用)"

  - code: "0500"
    name: "商服用地"
    gb_ref: "05"
    description: "GB/T 21010 一级类 05 商服用地 汇总码 (项目内部使用)"

  - code: "0600"
    name: "工矿仓储用地"
    gb_ref: "06"
    description: "GB/T 21010 一级类 06 工矿仓储用地 汇总码 (项目内部使用)"

  - code: "0700"
    name: "住宅用地"
    gb_ref: "07"
    description: "GB/T 21010 一级类 07 住宅用地 汇总码 (项目内部使用)"

  - code: "0800"
    name: "公共管理与公共服务用地"
    gb_ref: "08"
    description: "GB/T 21010 一级类 08 公共管理与公共服务用地 汇总码 (项目内部使用)"

  - code: "0900"
    name: "特殊用地"
    gb_ref: "09"
    description: "GB/T 21010 一级类 09 特殊用地 汇总码 (项目内部使用)"

  - code: "1000"
    name: "交通运输用地"
    gb_ref: "10"
    description: "GB/T 21010 一级类 10 交通运输用地 汇总码 (项目内部使用)"
