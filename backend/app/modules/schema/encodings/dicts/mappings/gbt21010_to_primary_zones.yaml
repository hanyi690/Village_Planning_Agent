# GB/T 21010-2017 DLBM → 三区 (primary_zone) 映射
# 来源: 三区三线体系 (《若干意见》2019)
#   农业空间: 耕地/园地/林地/草地/农田保护区/一般农业区/林业发展区
#   生态空间: 生态保护区/生态控制区/水域/自然保留地
#   城镇空间: 村庄建设区/建设用地区
#
# 注: mapping 应在 gbt21010_to_planning_zones.yaml 之后派生
#     实际实现可通过 planning_zones.yaml 中每个 entry 的 primary_zone 字段派生
version: "2026_GUANGDONG_V1"
standard: "三区三线 (《若干意见》2019)"
source_system: gbt21010
target_system: primary_zones

