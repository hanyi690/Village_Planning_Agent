# 来源: 广东省村庄规划编制基本技术指南附录5 的 dlbm_ref → zone_type 字段
#   1100 耕地(dlbm_ref=0100)→农业用地
#   1200 园地(dlbm_ref=0200)→农业用地
#   1340 商品林(dlbm_ref=0301)→农业用地, 1350 生态林(dlbm_ref=0301)→生态绿地
#   1400 草地(dlbm_ref=0400)→生态绿地
#   1500 其他农用地 →农业用地
#   1510 设施农用地 →农业用地
#   2100 城镇用地(dlbm_ref=0701)→居住用地
#   2121 宅基地(dlbm_ref=0702)→居住用地
#   2122 公共服务设施用地(dlbm_ref=0800)→公共服务用地
#   2123 基础设施用地(dlbm_ref=1300)→交通用地
#   2124 经营性建设用地(dlbm_ref=0900)→产业用地
#   2125 景观与绿化用地(dlbm_ref=1401)→公共服务用地
#   2126 村内交通用地(dlbm_ref=0601)→交通用地
#   2130 采矿用地(dlbm_ref=0600)→产业用地
#   2200 对外交通用地(dlbm_ref=1200)→交通用地
#   2310 风景名胜设施用地(dlbm_ref=0808)→公共服务用地
#   2320 特殊用地(dlbm_ref=0809)→公共服务用地
#   2270 水利设施用地(dlbm_ref=1311)→农业用地
#   3100 水域(dlbm_ref=1700)→水域
#   3200 自然保留地(dlbm_ref=2300)→农业用地
#
# 注: 0301-0307 林地按 "商品林" 处理 → 农业用地
#     实际项目中可能有商品林/生态林区分，需要决策规则
