# GB 50137-2011 城市用地分类与规划建设用地标准 — 单一真相源
#
# 来源: GB 50137-2011《城市用地分类与规划建设用地标准》
#   9 大类 + 居住用地大类（R）+ 公共设施用地大类（C）+ 工业用地大类（M）
#   + 物流仓储用地大类（W）+ 对外交通用地大类（T）+ 道路与交通设施用地大类（S）
#   + 公用设施用地大类（U）+ 绿地与广场用地大类（G）+ 特殊用地大类（D）
#
# 用途: 城市规划场景下用地功能分类。
#   - 与三大类（土地管理法）不同
#   - 与附录5 5-tier（村庄功能类）不同
#   - 与 GB 50188 镇规划 8 大类不同
#
# 注: GB 50137 是城市标准；村庄规划中通常不使用，
#   本字典保留用于城镇开发边界内场景及跨标准对照。
version: "2026_GUANGDONG_V1"
standard: "GB 50137-2011《城市用地分类与规划建设用地标准》"
system: "zone_types_gbt50137"
code_format: "字母码 (R/C/M/W/T/S/U/G/D)"

classes:
  - code: "R"
    name: "居住用地"
    gb_ref: "GB 50137-2011 R"
    description: "住宅和相应服务设施用地"

  - code: "A"
    name: "公共管理与公共服务用地"
    gb_ref: "GB 50137-2011 A"
    description: "行政办公、文化设施、教育科研、体育、医疗、社会福利、文物古迹、外事等用地"

  - code: "B"
    name: "商业服务业设施用地"
    gb_ref: "GB 50137-2011 B"
    description: "商业、商务、娱乐康体、公用设施营业网点等用地"

  - code: "M"
    name: "工业用地"
    gb_ref: "GB 50137-2011 M"
    description: "工矿企业的生产车间、库房及其附属设施用地"

  - code: "W"
    name: "物流仓储用地"
    gb_ref: "GB 50137-2011 W"
    description: "物资储备、中转、配送等用地"

  - code: "S"
    name: "道路与交通设施用地"
    gb_ref: "GB 50137-2011 S"
    description: "城市道路、交通设施等用地"

  - code: "U"
    name: "公用设施用地"
    gb_ref: "GB 50137-2011 U"
    description: "供应、环境、安全等公用设施用地"

  - code: "G"
    name: "绿地与广场用地"
    gb_ref: "GB 50137-2011 G"
    description: "公园绿地、防护绿地、广场等公共开放空间用地"

  - code: "D"
    name: "特殊用地"
    gb_ref: "GB 50137-2011 D"
    description: "军事、外事、宗教、监教、殡葬等特殊性质用地"