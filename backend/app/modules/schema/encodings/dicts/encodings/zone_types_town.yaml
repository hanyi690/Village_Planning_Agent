# GB 50188-2007 镇规划标准 — 8 大类建设用地
#
# 来源: GB 50188-2007《镇规划标准》第 4.1.3 节 表 4.1.3
#   "镇建设用地是指参与建设用地平衡和指标计算的用地，
#    即镇用地分类表4.1.3中前八大类用地之和。
#    第九大类'水域和其他用地'不属于建设用地的范围，
#    不参与建设用地的平衡和指标的计算。"
#
# 8 大类: 居住用地 / 公共设施用地 / 生产设施用地 / 仓储用地 /
#         对外交通用地 / 道路广场用地 / 工程设施用地 / 绿地
#
# 用途: 镇规划场景，与 GB 50137（城市）和 附录5（村庄）并列。
version: "2026_GUANGDONG_V1"
standard: "GB 50188-2007《镇规划标准》表 4.1.3"
system: "zone_types_town"
note: |
  GB 50188-2007 已被《镇规划标准》(2018 修订报批稿) 部分替代，
  但 8 大类框架仍广泛使用。本字典保留 8 大类原始分类。

classes:
  - code: "居住用地"
    name: "居住用地"
    gb_ref: "GB 50188-2007 表 4.1.3 1"
    description: "镇住宅及其附属设施用地"

  - code: "公共设施用地"
    name: "公共设施用地"
    gb_ref: "GB 50188-2007 表 4.1.3 2"
    description: "行政办公、商业金融、文化体育、医疗卫生、教育等设施用地"

  - code: "生产设施用地"
    name: "生产设施用地"
    gb_ref: "GB 50188-2007 表 4.1.3 3"
    description: "工业、矿业等生产性设施用地"

  - code: "仓储用地"
    name: "仓储用地"
    gb_ref: "GB 50188-2007 表 4.1.3 4"
    description: "物资储备、中转、仓储用地"

  - code: "对外交通用地"
    name: "对外交通用地"
    gb_ref: "GB 50188-2007 表 4.1.3 5"
    description: "铁路、公路、港口、机场等对外交通设施用地"

  - code: "道路广场用地"
    name: "道路广场用地"
    gb_ref: "GB 50188-2007 表 4.1.3 6"
    description: "镇内道路、广场、停车场等用地"

  - code: "工程设施用地"
    name: "工程设施用地"
    gb_ref: "GB 50188-2007 表 4.1.3 7"
    description: "给排水、供电、燃气、供热、环卫等公用工程设施用地"

  - code: "绿地"
    name: "绿地"
    gb_ref: "GB 50188-2007 表 4.1.3 8"
    description: "镇内公园、防护绿地、附属绿地等"

  - code: "水域和其他用地"
    name: "水域和其他用地"
    gb_ref: "GB 50188-2007 表 4.1.3 9"
    description: "水域和未利用地（不计入建设用地指标）"