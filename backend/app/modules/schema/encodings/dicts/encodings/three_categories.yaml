# 三大类 — 单一真相源
#
# 来源: 《中华人民共和国土地管理法》第四条
#   "国家编制土地利用总体规划，规定土地用途，将土地分为农用地、建设用地和未利用地。"
#
# 关系: GB/T 21010-2017 附录 A 将 DLBM 映射到三大类。
#       本编码是基础法定的"宏观三大类"，与三区三线"三区"（生态/农业/城镇空间）不同。
#       与附录5 5-tier（村庄功能分类）也不同。
#
# 与附录5 5-tier 的对应关系（参考）：
#   农业用地   ↔ 农业用地
#   建设用地   ↔ 居住用地 / 公共服务用地 / 交通用地 / 产业用地 / 商业用地
#   未利用地   ↔ 水域 / 生态绿地（部分）
version: "2026_GUANGDONG_V1"
standard: "《中华人民共和国土地管理法》第四条 (2002 颁布, 2019 修正)"
system: "three_categories"

classes:
  - code: "农用地"
    name: "农用地"
    legal_ref: "《土地管理法》第四条第一款"
    description: "包括直接用于农业生产的土地，具体分为水田、水浇地、旱地、果园、茶园、橡胶园、其它园地、乔木林地、竹林地、红树林地、森林沼泽、灌木林地、灌丛沼泽、其他林地、天然牧草地、沼泽草地、人工牧草地等。"

  - code: "建设用地"
    name: "建设用地"
    legal_ref: "《土地管理法》第四条第二款"
    description: "建造指建造建筑物、构筑物的土地，包括零售商业用地、批发市场用地、餐饮用地、旅馆用地、商务金融用地、娱乐用地、其他商服用地、工业用地、采矿用地、盐田、仓储用地、城镇住宅用地、农村宅基地以及公共管理与公共服务性用地等，如机关团体用地、新闻出版用地、教育用地、科研用地、医疗卫生用地、社会福利用地、文化设施用地、体育用地、公共设施用地、公园与绿地等。建筑物、构筑物的土地"

  - code: "未利用地"
    name: "未利用地"
    legal_ref: "《土地管理法》第四条第三款"
    description: "指农用地和建设用地以外的土地，包括其他草地、河流水面、湖泊水面、沿海滩涂、内陆滩涂、沼泽地、冰川及永久积雪、盐碱地、沙地、裸土地、裸岩石（砾）地等"