# 三区（国土空间规划三大类空间）— 单一真相源
#
# 来源: 《中共中央 国务院关于建立国土空间规划体系并监督实施的若干意见》（2019）
#   "科学有序统筹布局生态、农业、城镇等功能空间"
#
# 三区 = 生态空间 / 农业空间 / 城镇空间
#
# ⚠ 校正: 原代码 PRIMARY_ZONE_NAMES = ["生态空间", "农业空间", "建设空间"]
#   中"建设空间"应改为"城镇空间"（依据《若干意见》原文）。
#
# 与三大类（土地管理法）的区别:
#   - 三大类（农用地/建设用地/未利用地）按土地实际用途分
#   - 三区（生态/农业/城镇空间）按国土空间规划主导功能分
#   - 同一地块可能属于"农用地"（三大类）但位于"生态空间"（三区）
version: "2026_GUANGDONG_V1"
standard: "中共中央 国务院 2019《若干意见》 + 自然资源部 双评价指南"
system: "primary_zones"

classes:
  - code: "生态空间"
    name: "生态空间"
    description: "以生态保护为主导功能的国土空间，含生态保护红线、生态控制区等"

  - code: "农业空间"
    name: "农业空间"
    description: "以农业生产为主导功能的国土空间，含永久基本农田、一般农业区、林业发展区等"

  - code: "城镇空间"
    name: "城镇空间"
    description: "以城镇建设为主导功能的国土空间，含城镇开发边界内的建设区域"