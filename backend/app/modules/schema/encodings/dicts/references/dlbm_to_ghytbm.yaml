# 三调 DLBM -> 规划用途 GHYTBM 正向映射
#
# 唯一真相源 - 基数转换的核心映射表
#
# 来源: 《实用性村庄规划编制手册》实验二 + appendix5.yaml 反向 dlbm_ref
#
# 两种转换类型:
#   一一对应: 三调编码直接映射到附录5编码 (确定性)
#   一对多:   一个三调编码需根据条件映射到多个附录5编码 (需消歧)
#
# 注意: 此文件替代 appendix5.yaml 中不可靠的 dlbm_ref 字段
#       dlbm_ref 仅作为参考，不作为运行时映射依据

version: "2026_GUANGDONG_V1"
standard: "国土空间调查、规划、用途管制用地用海分类指南 + 广东省技术指南附录5"

mappings:
  # ── 一一对应 (确定性映射) ──
  - dlbm: "0101"
    ghytbm: "1100"
    conversion_type: "一一对应"
  - dlbm: "0102"
    ghytbm: "1100"
    conversion_type: "一一对应"
  - dlbm: "0103"
    ghytbm: "1100"
    conversion_type: "一一对应"
  - dlbm: "0201"
    ghytbm: "1200"
    conversion_type: "一一对应"
  - dlbm: "0202"
    ghytbm: "1200"
    conversion_type: "一一对应"
  - dlbm: "0203"
    ghytbm: "1200"
    conversion_type: "一一对应"
  - dlbm: "0204"
    ghytbm: "1200"
    conversion_type: "一一对应"
  - dlbm: "0401"
    ghytbm: "1400"
    conversion_type: "一一对应"
  - dlbm: "0403"
    ghytbm: "1400"
    conversion_type: "一一对应"
  - dlbm: "0701"
    ghytbm: "2100"
    conversion_type: "一一对应"
  - dlbm: "0702"
    ghytbm: "2121"
    conversion_type: "一一对应"
  - dlbm: "0601"
    ghytbm: "2126"
    conversion_type: "一一对应"
  - dlbm: "0602"
    ghytbm: "2130"
    conversion_type: "一一对应"
  - dlbm: "1101"
    ghytbm: "3100"
    conversion_type: "一一对应"
  - dlbm: "1102"
    ghytbm: "3100"
    conversion_type: "一一对应"
  - dlbm: "1103"
    ghytbm: "3100"
    conversion_type: "一一对应"
  - dlbm: "1104"
    ghytbm: "3100"
    conversion_type: "一一对应"
  - dlbm: "1201"
    ghytbm: "3200"
    conversion_type: "一一对应"
  - dlbm: "1202"
    ghytbm: "3200"
    conversion_type: "一一对应"
  - dlbm: "1203"
    ghytbm: "3200"
    conversion_type: "一一对应"
  - dlbm: "1204"
    ghytbm: "3200"
    conversion_type: "一一对应"
  - dlbm: "1205"
    ghytbm: "3200"
    conversion_type: "一一对应"
  - dlbm: "1206"
    ghytbm: "3200"
    conversion_type: "一一对应"
  - dlbm: "1207"
    ghytbm: "3200"
    conversion_type: "一一对应"
  - dlbm: "1208"
    ghytbm: "3100"
    conversion_type: "一一对应"
  - dlbm: "1311"
    ghytbm: "2270"
    conversion_type: "一一对应"
  - dlbm: "1312"
    ghytbm: "2270"
    conversion_type: "一一对应"

  # ── 一对多 (需消歧) ──
  - dlbm: "0301"
    ghytbm: "1340"
    conversion_type: "一对多"
    condition: "商品林"
    alternative_ghytbm: "1350"
    alternative_condition: "生态林"
    description: "乔木林地需根据林业部门认定区分商品林/生态林"
  - dlbm: "0302"
    ghytbm: "1340"
    conversion_type: "一对多"
    condition: "商品林"
    alternative_ghytbm: "1350"
    alternative_condition: "生态林"
  - dlbm: "0305"
    ghytbm: "1340"
    conversion_type: "一对多"
    condition: "商品林"
    alternative_ghytbm: "1350"
    alternative_condition: "生态林"
  - dlbm: "0307"
    ghytbm: "1340"
    conversion_type: "一对多"
    condition: "商品林"
    alternative_ghytbm: "1350"
    alternative_condition: "生态林"

  # ── 设施农用地 ──
  - dlbm: "0602"
    ghytbm: "1510"
    conversion_type: "一一对应"
    description: "注意: 0602 同时映射到 2130(采矿) 和 1510(设施农用地)，需按实际用途消歧"

  # ── 建设用地细分 (需 POI/地形图/影像辅助) ──
  - dlbm: "0809"
    ghytbm: "2123"
    conversion_type: "一对多"
    condition: "基础设施"
    alternative_ghytbm: "2122"
    alternative_condition: "公共服务设施"
    description: "公用设施用地需细分为基础设施或公服设施"

  # ── 默认映射 (无明确对应的归为自然保留地) ──
  - dlbm: "1004"
    ghytbm: "2200"
    conversion_type: "一一对应"
    description: "城镇村道路用地 -> 对外交通用地"

  - dlbm: "1003"
    ghytbm: "2200"
    conversion_type: "一一对应"
    description: "公路用地 -> 对外交通用地"
