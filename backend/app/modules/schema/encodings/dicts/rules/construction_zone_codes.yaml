# 建设用地管制区编码 (JSYDGZQ / TDKJGZFQDM)
#
# 唯一真相源 - 统一为 01-06 编码体系
# 替代 planning_zone_rules.yaml 中的 510/520/530/540 旧编码
#
# 来源: 广东省村庄规划编制基本技术指南（试行）表6
#   01-04 为技术指南原文规定的 4 类
#   05-06 为三区三线体系扩展（永久基本农田保护区 + 生态保护红线区）
#
# 与 spatial_types.py ConstructionCtrlZone 类常量一致:
#   ALLOWED_CONSTRUCTION = "01"
#   RESTRICTED = "02"
#   CONDITIONAL = "03"
#   PROHIBITED_CONSTRUCTION = "04"
#   BASIC_FARMLAND_ZONE = "05"
#   ECOLOGICAL_REDLINE_ZONE = "06"

version: "2026_GUANGDONG_V1"
standard: "广东省村庄规划编制基本技术指南（试行）表6"

codes:
  - code: "01"
    name: "允许建设区"
    color: "#FFE0B2"
    description: "村庄建设边界内部"

  - code: "02"
    name: "限制建设区"
    color: "#C8E6C9"
    description: "一般农业和生态区域"

  - code: "03"
    name: "有条件建设区"
    color: "#FFF9C4"
    description: "不超过现状建设用地规模20%"

  - code: "04"
    name: "禁止建设区"
    color: "#FFCDD2"
    description: "永久基本农田和生态保护红线外禁止建设区域"

  - code: "05"
    name: "永久基本农田保护区"
    color: "#00AA00"
    description: "上位规划落实，不可调整"

  - code: "06"
    name: "生态保护红线区"
    color: "#FF0000"
    description: "上位规划落实，不可调整"

# planning_zone -> tdkjgzfqdm 映射
# 用于从地块级 planning_zone 推导分区级 TDKJGZFQDM
planning_zone_to_control_code:
  "村庄建设区": "01"
  "一般农业区": "02"
  "林业发展区": "02"
  "生态控制区": "02"
  "生态保护区": "04"
  "农田保护区": "05"
