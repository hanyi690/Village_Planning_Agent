# GHFLBM -> TDYTFQDM 映射 (土地用途分区代码)
#
# 唯一真相源 - TDYT 图层的法定编码
#
# 来源: 粤国土资规保发〔2009〕67号《广东省县级土地利用总体规划数据库标准》
#   TDYTFQDM 为 4 位乡级规划分类编码 (TD/T 1028-2010)
#
# 映射链: GHYTBM(附录5) -> GHFLBM(规划分类) -> TDYTFQDM(乡规4位码)
# 基数: 多对一 (多个 GHFLBM 可映射到同一 TDYTFQDM)
#
# 注意: 此文件替代 land_use_zone_generator.py 中错误使用 VNE 字母码的做法

version: "2026_GUANGDONG_V1"
standard: "粤国土资规保发〔2009〕67号 + TD/T 1028-2010"

mappings:
  # ── 农业用地 ──
  - ghflbm: "1110"
    tdyfqdm: "0100"
    name: "农业用地"
  - ghflbm: "1120"
    tdyfqdm: "0100"
    name: "农业用地"
  - ghflbm: "1310"
    tdyfqdm: "0100"
    name: "农业用地"
  - ghflbm: "1530"
    tdyfqdm: "0100"
    name: "农业用地"
  - ghflbm: "1520"
    tdyfqdm: "0100"
    name: "农业用地"

  # ── 林业用地 ──
  - ghflbm: "1130"
    tdyfqdm: "0200"
    name: "林业用地"
  - ghflbm: "1330"
    tdyfqdm: "0200"
    name: "林业用地"

  # ── 生态用地 ──
  - ghflbm: "1200"
    tdyfqdm: "0300"
    name: "生态用地"

  # ── 村庄建设用地 ──
  - ghflbm: "2120"
    tdyfqdm: "0600"
    name: "村庄建设用地"

  # ── 水域 ──
  - ghflbm: "3110"
    tdyfqdm: "0700"
    name: "水域"

  # ── 水利设施 ──
  - ghflbm: "2270"
    tdyfqdm: "0800"
    name: "水利设施用地"
