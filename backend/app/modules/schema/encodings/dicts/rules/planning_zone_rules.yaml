# 规划分区决策规则
#
# v2.0 (2026-07-26): 建设用地管制区编码 (510/520/530/540) 已移至
# construction_zone_codes.yaml (统一为 01-06 编码)
# 本文件仅保留 planning_zone -> primary_zone 映射和决策规则
version: "2026_GUANGDONG_V1"
standard: "自然资源部《双评价指南》2019"

# 规划分区层级关系 (唯一真相源 - code_sets.py 从此加载)
planning_zone_to_primary_zone:
  "生态保护区": "生态空间"
  "生态控制区": "生态空间"
  "农田保护区": "农业空间"
  "一般农业区": "农业空间"
  "林业发展区": "农业空间"
  "村庄建设区": "建设空间"

# 决策规则 - 按优先级从高到低执行
decision_rules:
  - priority: 1
    condition: "in_ecological_redline AND base_zone == '村庄建设区'"
    result: "生态保护区"
    description: "生态红线内建设区强制降级为生态保护区"

  - priority: 2
    condition: "in_basic_farmland AND dlbm in BASIC_FARMLAND_CODES"
    result: "农田保护区"
    description: "基本农田内强制为农田保护区"

  - priority: 3
    condition: "near_hazard AND base_zone == '村庄建设区'"
    result: "生态控制区"
    params:
      hazard_buffer_m: 500
    description: "地质灾害500m缓冲区内建设区降级为生态控制区"
