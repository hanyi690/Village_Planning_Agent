# 村庄规划阶段配置
# 此文件是28维度配置的唯一来源

phases:
- id: layer1
  name: 现状分析
  execution: parallel
  dimensions:
  - key: location
    name: 区位与对外交通分析
    tools: []
    rag_query: 村庄区位条件分析 对外交通规划要求 交通设施配置标准
    prefer_doc_types:
    - standard
    depends_on: []
    semantic:
      focus: 行政区、自然村、道路、水系和对外联系的身份、别名、方向和关系；不把地点名本身变成规划项目。
      source_section_hints:
      - 区位分析
      l1_fact_types:
      - spatial_entity
      - spatial_relation
      - scoped_metric
      - document_observation
      l3_claim_families:
      - evidence_statement
      - constraint
      - objective
      - axis
      - road
      l3_grounding_requirements:
      - place_binding
      - network_snapshot
      spatial_authority: L1 facts and explicit GIS evidence only; no name-only location inference
    evidence:
      entity_scope:
      - settlements
      - roads
      - waters
      - zones
  - key: socio_economic
    name: 社会经济分析
    tools: []
    rag_query: 村庄人口规模预测方法 人均建设用地指标 人口增长率计算
    prefer_doc_types:
    - policy
    - standard
    depends_on: []
    semantic:
      focus: 人口、户数、产业、就业和服务需求；没有空间证据时只产指标或需求，不生成点位。
      source_section_hints:
      - 社会经济分析
      l1_fact_types:
      - scoped_metric
      - spatial_entity
      - demand
      - constraint
      - opportunity
      - document_observation
      l3_claim_families:
      - indicator
      - objective
      - project_package
      - facility
      - site_area
      - action
      l3_grounding_requirements:
      - place_binding
      - demand_points
      - candidate_geometry
      spatial_authority: L1 facts and explicit GIS evidence only; no name-only location inference
    evidence:
      entity_scope:
      - settlements
      - facilities
      - parcels
  - key: villager_wishes
    name: 村民意愿与诉求分析
    semantic:
      focus: 村民诉求、受益对象、紧迫性和位置线索；诉求不是现状资产，位置不明确则保留为需求或待核验。
      source_section_hints:
      - 村庄发展诉求
      l1_fact_types:
      - demand
      - spatial_entity
      - constraint
      - opportunity
      - document_observation
      l3_claim_families:
      - objective
      - project_package
      - facility
      - road
      - site_area
      - action
      l3_grounding_requirements:
      - place_binding
      - demand_points
      - candidate_geometry
      spatial_authority: L1 facts and explicit GIS evidence only; no name-only location inference
    evidence:
      entity_scope:
      - settlements
      - facilities
      - annotations
    tools: []
    rag_query: 村民意愿调查方法 村庄规划公众参与 问卷调查技术规范
    prefer_doc_types:
    - standard
    - guide
    depends_on: []
  - key: superior_planning
    name: 上位规划与政策导向分析
    semantic:
      focus: 法定指标、政策约束、期限和适用范围；不得把政策条文直接当作地块或几何。
      source_section_hints:
      - 上位规划
      - 村庄现状
      l1_fact_types:
      - scoped_metric
      - constraint
      - spatial_entity
      - spatial_relation
      - document_observation
      l3_claim_families:
      - indicator
      - constraint
      - objective
      - action
      l3_grounding_requirements:
      - place_binding
      - topology
      spatial_authority: L1 facts and explicit GIS evidence only; no name-only location inference
    evidence:
      entity_scope:
      - zones
      - settlements
      - annotations
    tools: []
    rag_query: 上位规划衔接要求 村庄规划政策依据 土地利用总体规划
    prefer_doc_types:
    - policy
    - planning
    depends_on: []
  - key: natural_environment
    name: 自然环境分析
    semantic:
      focus: 地形、水系、灾害、生态敏感性和保护边界；保护/避让优先，不能把风险描述默认为建设候选。
      source_section_hints:
      - 自然环境分析
      l1_fact_types:
      - spatial_entity
      - constraint
      - risk
      - scoped_metric
      - spatial_relation
      - document_observation
      l3_claim_families:
      - constraint
      - protection
      - restoration
      - zone
      - site_area
      - action
      l3_grounding_requirements:
      - candidate_geometry
      - topology
      - parcel_membership
      spatial_authority: L1 facts and explicit GIS evidence only; no name-only location inference
    evidence:
      entity_scope:
      - parcels
      - waters
      - hazards
      - zones
    tools: []
    rag_query: 村庄自然环境评价 地形地貌分析技术 生态敏感性评价
    prefer_doc_types:
    - standard
    - guide
    depends_on: []
  - key: land_use
    name: 土地利用分析
    tools: []
    rag_query: 村庄用地分类标准 建设用地指标控制 土地利用现状调查
    prefer_doc_types:
    - policy
    - standard
    depends_on: []
    semantic:
      focus: 现状地类、面积、权属/适宜性和管控边界；现状地类不等于规划地类，整块与部分占用必须分开。
      source_section_hints:
      - 土地利用分析
      l1_fact_types:
      - spatial_entity
      - scoped_metric
      - constraint
      - spatial_relation
      - document_observation
      l3_claim_families:
      - indicator
      - constraint
      - zone
      - site_area
      - protection
      - restoration
      l3_grounding_requirements:
      - parcel_membership
      - candidate_geometry
      - topology
      spatial_authority: L1 facts and explicit GIS evidence only; no name-only location inference
    evidence:
      entity_scope:
      - parcels
      - zones
      - waters
  - key: traffic
    name: 道路交通分析
    semantic:
      focus: 现状道路、等级、宽度、通行问题、端点和网络关系；道路规划必须提供 typed endpoint/alignment 线索，不能复制现状线。
      source_section_hints:
      - 道路交通分析
      l1_fact_types:
      - spatial_entity
      - spatial_relation
      - scoped_metric
      - constraint
      - risk
      - document_observation
      l3_claim_families:
      - road
      - axis
      - constraint
      - objective
      - action
      l3_grounding_requirements:
      - network_snapshot
      - place_binding
      - candidate_geometry
      - parcel_membership
      spatial_authority: L1 facts and explicit GIS evidence only; no name-only location inference
    evidence:
      entity_scope:
      - roads
      - settlements
      - facilities
      - parcels
    tools: []
    rag_query: 村庄道路等级分类 交通可达性分析 道路宽度标准
    prefer_doc_types:
    - standard
    - guide
    depends_on: []
  - key: public_services
    name: 公共服务设施分析
    semantic:
      focus: 设施类型、现状能力、服务半径、服务对象和缺口；coverage 需要明确 demand points，人口总数不能直接充当空间需求点。
      source_section_hints:
      - 公共服务设施分析
      l1_fact_types:
      - spatial_entity
      - demand
      - scoped_metric
      - constraint
      - spatial_relation
      - document_observation
      l3_claim_families:
      - facility
      - site_area
      - objective
      - action
      l3_grounding_requirements:
      - demand_points
      - candidate_geometry
      - network_snapshot
      - parcel_membership
      spatial_authority: L1 facts and explicit GIS evidence only; no name-only location inference
    evidence:
      entity_scope:
      - facilities
      - settlements
      - roads
    tools: []
    rag_query: 村庄公共服务设施配置标准 村级公共服务设施规划要求
    prefer_doc_types:
    - standard
    - policy
    depends_on: []
  - key: infrastructure
    name: 基础设施分析
    semantic:
      focus: 给排水、电力、通信和设施网络的现状、缺口、端点与服务关系；线性工程必须保持线性资产类型。
      source_section_hints:
      - 基础设施分析
      l1_fact_types:
      - spatial_entity
      - demand
      - spatial_relation
      - scoped_metric
      - constraint
      - risk
      - document_observation
      l3_claim_families:
      - road
      - facility
      - site_area
      - constraint
      - action
      l3_grounding_requirements:
      - network_snapshot
      - place_binding
      - candidate_geometry
      - parcel_membership
      spatial_authority: L1 facts and explicit GIS evidence only; no name-only location inference
    evidence:
      entity_scope:
      - facilities
      - roads
      - parcels
      - settlements
    tools: []
    rag_query: 村庄基础设施配置标准 给排水设施规划 电力通信设施
    prefer_doc_types:
    - standard
    - guide
    depends_on: []
  - key: ecological_green
    name: 生态绿地分析
    semantic:
      focus: 生态斑块、廊道、绿地和保护约束；functional overlay、protection 和 restoration 必须区分。
      source_section_hints:
      - 绿地与活动场地分析
      - 自然环境分析
      l1_fact_types:
      - spatial_entity
      - spatial_relation
      - scoped_metric
      - constraint
      - risk
      - document_observation
      l3_claim_families:
      - protection
      - restoration
      - zone
      - site_area
      - constraint
      - action
      l3_grounding_requirements:
      - candidate_geometry
      - topology
      - parcel_membership
      spatial_authority: L1 facts and explicit GIS evidence only; no name-only location inference
    evidence:
      entity_scope:
      - parcels
      - waters
      - zones
      - hazards
    tools: []
    rag_query: 村庄绿地系统规划 生态保护红线划定 绿地覆盖率标准
    prefer_doc_types:
    - standard
    - guide
    depends_on: []
  - key: architecture
    name: 建筑分析
    semantic:
      focus: 建筑质量、风貌、界面和改造对象；建筑描述不能直接生成建设地块。
      source_section_hints:
      - 建筑现状分析
      l1_fact_types:
      - spatial_entity
      - spatial_relation
      - scoped_metric
      - constraint
      - risk
      - document_observation
      l3_claim_families:
      - site_area
      - protection
      - restoration
      - action
      - constraint
      l3_grounding_requirements:
      - candidate_geometry
      - parcel_membership
      - place_binding
      spatial_authority: L1 facts and explicit GIS evidence only; no name-only location inference
    evidence:
      entity_scope:
      - facilities
      - settlements
      - annotations
    tools: []
    rag_query: 村庄建筑质量评价 农房建设标准 建筑风貌分类
    prefer_doc_types:
    - standard
    - policy
    depends_on: []
  - key: historical_culture
    name: 历史文化与乡愁保护分析
    semantic:
      focus: 文保单位、传统建筑、历史路径及保护级别；保护对象身份和范围要有来源，不因文化描述泛化成整村禁建。
      source_section_hints:
      - 历史文化资源分析
      l1_fact_types:
      - spatial_entity
      - spatial_relation
      - constraint
      - scoped_metric
      - document_observation
      l3_claim_families:
      - protection
      - restoration
      - zone
      - site_area
      - action
      l3_grounding_requirements:
      - candidate_geometry
      - topology
      - parcel_membership
      - place_binding
      spatial_authority: L1 facts and explicit GIS evidence only; no name-only location inference
    evidence:
      entity_scope:
      - facilities
      - settlements
      - annotations
      - zones
    tools: []
    rag_query: 历史文化保护规划 传统村落保护要求 乡土文化传承
    prefer_doc_types:
    - policy
    - standard
    depends_on: []
- id: layer2
  name: 规划思路
  execution: wave
  dimensions:
  - key: resource_endowment
    name: 资源禀赋分析
    tools: []
    rag_query: ''
    kg_query: analysis+shared
    depends_on: []
    layer_depends_on:
    - natural_environment
    - land_use
    - socio_economic
    - historical_culture
    - architecture
    - public_services
    semantic:
      focus: '自然资源、建设条件、设施基础和空间承载能力的综合禀赋；只形成可追溯的资源事实和约束，不直接替代详细规划落位。'
      l1_fact_types:
      - spatial_entity
      - spatial_relation
      - demand
      - scoped_metric
      - constraint
      - risk
      - opportunity
      - document_observation
      l3_claim_families:
      - evidence_statement
      - objective
      - constraint
      - zone
      - site_area
      - facility
      - action
      l3_grounding_requirements:
      - place_binding
      - candidate_geometry
      spatial_authority: L1 facts and explicit GIS evidence only; no name-only location inference
    evidence:
      entity_scope:
      - parcels
      - facilities
      - roads
      - waters
      - hazards
      - zones
      - settlements
  - key: planning_positioning
    name: 规划定位分析
    tools: []
    rag_query: ''
    kg_query: analysis+shared
    depends_on:
    - resource_endowment
    layer_depends_on:
    - location
    - socio_economic
    - superior_planning
    semantic:
      focus: '基于资源、区位、人口和政策约束提炼村庄功能定位与发展方向；保持高度抽象，不生成未经 GROUND 核验的空间项目。'
      l1_fact_types:
      - spatial_entity
      - spatial_relation
      - demand
      - scoped_metric
      - constraint
      - risk
      - opportunity
      - document_observation
      l3_claim_families:
      - evidence_statement
      - objective
      - constraint
      - indicator
      - action
      l3_grounding_requirements:
      - place_binding
      - candidate_geometry
      spatial_authority: L1 facts and explicit GIS evidence only; no name-only location inference
    evidence:
      entity_scope:
      - settlements
      - roads
      - facilities
      - zones
      - parcels
  - key: development_goals
    name: 发展目标分析
    tools: []
    rag_query: ''
    kg_query: analysis+shared
    depends_on:
    - resource_endowment
    - planning_positioning
    layer_depends_on:
    - socio_economic
    - superior_planning
    semantic:
      focus: '将规划定位转化为可审计的发展目标、阶段目标和约束指标；目标必须回指上游事实，不把目标表述伪装成空间几何。'
      l1_fact_types:
      - spatial_entity
      - spatial_relation
      - demand
      - scoped_metric
      - constraint
      - risk
      - opportunity
      - document_observation
      l3_claim_families:
      - evidence_statement
      - objective
      - indicator
      - constraint
      - action
      l3_grounding_requirements:
      - place_binding
      - candidate_geometry
      spatial_authority: L1 facts and explicit GIS evidence only; no name-only location inference
    evidence:
      entity_scope:
      - settlements
      - facilities
      - parcels
      - zones
  - key: planning_strategies
    name: 规划策略分析
    tools:
    - population_prediction
    rag_query: ''
    kg_query: analysis+shared
    depends_on:
    - resource_endowment
    - planning_positioning
    - development_goals
    layer_depends_on:
    - socio_economic
    - natural_environment
    - land_use
    - traffic
    - infrastructure
    - historical_culture
    semantic:
      focus: '围绕发展目标形成分期、空间组织、设施补短板和资源保护策略；策略保持抽象，具体项目和位置由 L3/GROUND 继续核验。'
      l1_fact_types:
      - spatial_entity
      - spatial_relation
      - demand
      - scoped_metric
      - constraint
      - risk
      - opportunity
      - document_observation
      l3_claim_families:
      - evidence_statement
      - objective
      - project_package
      - zone
      - facility
      - road
      - constraint
      - action
      l3_grounding_requirements:
      - place_binding
      - candidate_geometry
      spatial_authority: L1 facts and explicit GIS evidence only; no name-only location inference
    evidence:
      entity_scope:
      - parcels
      - facilities
      - roads
      - waters
      - hazards
      - zones
      - settlements
- id: layer3
  name: 详细规划
  execution: wave
  dimensions:
  - key: industry
    name: 产业规划
    tools: []
    rag_query: 村庄产业发展规划 农村产业布局 一二三产融合
