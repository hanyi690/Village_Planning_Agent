      - spatial_entity
      - spatial_relation
      - demand
      - scoped_metric
      - constraint
      - risk
      - opportunity
      - document_observation
      l3_claim_families:
      - objective
      - zone
      - site_area
      - protection
      - restoration
      - constraint
      l3_grounding_requirements:
      - parcel_membership
      - candidate_geometry
      - topology
      spatial_authority: L1 facts and explicit GIS evidence only; no name-only location inference
    evidence:
      entity_scope:
      - parcels
      - zones
