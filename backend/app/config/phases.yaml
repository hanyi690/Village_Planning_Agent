      - objective
      - axis
      - zone
      - protection
      - restoration
      - site_area
      l3_grounding_requirements:
      - topology
      - candidate_geometry
      - parcel_membership
      - place_binding
      spatial_authority: L1 facts and explicit GIS evidence only; no name-only location inference
    evidence:
      entity_scope:
      - settlements
      - roads
      - zones
      - parcels
      - waters
  - key: land_use_planning
    name: 土地利用规划
    tools: []
    rag_query: 村庄土地利用规划 用地布局方案 建设用地边界划定
    kg_query: execute+shared
    prefer_doc_types:
    - policy
    - standard
    depends_on: []
    layer_depends_on:
    - land_use
    - natural_environment
    phase_depends_on:
    - planning_positioning
    - planning_strategies
    semantic:
      focus: 地类分配、功能叠加、保护/修复和面积约束；整块/部分占用和切割后的剩余地块必须由 GROUND 保留。
