  - key: settlement_planning
    name: 居民点规划
    tools: []
    rag_query: 村庄居民点布局 农村居民点规划 自然村整治方案
    kg_query: execute+shared
    prefer_doc_types:
    - standard
    - case
    depends_on: []
    layer_depends_on:
    - socio_economic
    phase_depends_on:
    - planning_positioning
    - planning_strategies
    semantic:
      focus: 居民点整治、公共节点和空间联系；不从自然村名单直接推导设施或搬迁地块。
      l1_fact_types:
      - spatial_entity
      - spatial_relation
      - demand
      - scoped_metric
      - constraint
      - risk
      - opportunity
      - document_observation
      l3_claim_families:
      - objective
      - site_area
      - facility
      - protection
      - restoration
      - action
      l3_grounding_requirements:
      - candidate_geometry
      - parcel_membership
      - place_binding
      - network_snapshot
      spatial_authority: L1 facts and explicit GIS evidence only; no name-only location inference
    evidence:
      entity_scope:
      - settlements
      - facilities
      - roads
      - parcels
  - key: traffic_planning
    name: 道路交通规划
    tools: []
    rag_query: 村庄道路规划技术 道路红线宽度 村内道路等级
    kg_query: execute+shared
    prefer_doc_types:
    - standard
    depends_on: []
    layer_depends_on:
    - traffic
    phase_depends_on:
    - planning_strategies
    semantic:
      focus: 道路/线性工程的中心线语义、端点、对齐关系和新增占地要求；道路不重复生成 site_area。
      l1_fact_types:
      - spatial_entity
      - spatial_relation
      - demand
      - scoped_metric
      - constraint
      - risk
      - opportunity
      - document_observation
      l3_claim_families:
      - road
