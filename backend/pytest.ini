[pytest]
testpaths = tests/e2e
addopts = -ra --maxfail=1 --tb=short --basetemp=.pytest-tmp-run -m "e2e and not slow"
faulthandler_timeout = 15
timeout = 30
timeout_method = thread
session_timeout = 90
cache_dir = .pytest-cache
markers =
    e2e: end-to-end tests that exercise multiple production stages
    slow: tests that are too expensive for the default regression loop
