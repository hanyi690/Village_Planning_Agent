[pytest]
testpaths = tests
norecursedirs = .git .venv venv node_modules docs references
addopts = -ra --maxfail=1 --tb=short -p no:cacheprovider -m "not slow"
tmp_path_retention_count = 0
tmp_path_retention_policy = none
timeout = 30
timeout_method = thread
markers =
    contracts: fast contract and storage invariant tests
    unit: isolated unit tests for one production boundary
    characterization: temporary current-behavior baselines with an expiry condition
    acceptance: business-slice acceptance tests
    e2e: end-to-end tests that exercise multiple production stages
    integration: tests that exercise production adapters with controlled data
    slow: tests that are too expensive for the default regression loop
