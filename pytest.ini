[pytest]
testpaths = backend/tests/core
pythonpath = backend
addopts = -ra --maxfail=1 --tb=short --basetemp=backend/.pytest-tmp-run -m "not integration and not slow"
faulthandler_timeout = 15
timeout = 30
timeout_method = thread
session_timeout = 90
cache_dir = .pytest-cache
markers =
    integration: tests that build the full graph or use real session infrastructure
    slow: tests that are too expensive for the default regression loop
